<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
  :root { --bg: #f6f5f1; --ink: #1c1a17; --muted: #6b665f; --line: #dcd8cf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 760px; margin: 0 auto; padding: 12vh 24px 80px; }
  h1 { font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.01em; }
  p.lead { color: var(--muted); margin: 0 0 56px; max-width: 34em; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding: 22px 0; color: inherit; text-decoration: none; }
  a strong { font-weight: 400; font-size: 24px; }
  a span { color: var(--muted); font: 15px/1.4 system-ui, sans-serif; text-align: right; }
  a:hover strong, a:focus-visible strong { text-decoration: underline; text-underline-offset: 5px; }
  @media (max-width: 520px) { a { flex-direction: column; gap: 2px; } a span { text-align: left; } }
</style>
</head>
<body>
<main>
  <h1>Portfolio</h1>
  <p class="lead">Four websites, rebuilt from archived copies and original design files.</p>
  <ul>
    <li><a href="rapidfire/"><strong>Rapidfire</strong><span>Marketing and design agency</span></a></li>
    <li><a href="lionman-talks/"><strong>LionMan Talks</strong><span>History talks and recordings</span></a></li>
    <li><a href="iquoti/"><strong>iQuoti</strong><span>Quotes from Mallorca’s businesses</span></a></li>
    <li><a href="nutria/"><strong>Nutria</strong><span>Nutrition factsheets</span></a></li>
  </ul>
</main>
</body>
</html>
